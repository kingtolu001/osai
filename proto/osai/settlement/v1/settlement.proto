syntax = "proto3";

package osai.settlement.v1;

option go_package = "github.com/osai/osai/proto/osai/settlement/v1;settlementv1";

message Money {
  int64 amount_minor = 1;
  string currency = 2;
}

message CreateSettlementForTradeRequest {
  string institution_id = 1;
  string trade_id = 2;
  string quote_id = 3;
  string idempotency_key = 4;
  string correlation_id = 5;
  string beneficiary = 6;
  Money amount = 7;
  string purpose = 8;
  string provider_id = 9;
  string bank_code = 10;
  string account_number = 11;
  string beneficiary_id = 12;
}

message SettlementResponse {
  string settlement_id = 1;
  string institution_id = 2;
  string trade_id = 3;
  string quote_id = 4;
  string status = 5;
  string beneficiary = 6;
  int64 amount_minor = 7;
  string currency = 8;
  string correlation_id = 9;
  string provider_id = 10;
  string client_ref = 11;
  string provider_ref = 12;
}

message GetSettlementRequest {
  string institution_id = 1;
  string settlement_id = 2;
  string correlation_id = 3;
}

message ListCustomerSettlementReportRequest {
  string institution_id = 1;
  int32 page = 2;
  int32 page_size = 3;
  string from = 4;
  string to = 5;
  string currency = 6;
  string status = 7;
}

message CustomerSettlementReportItem {
  string settlement_id = 1;
  string trade_id = 2;
  string quote_id = 3;
  string status = 4;
  int64 amount_minor = 5;
  string currency = 6;
  string occurred_at = 7;
}

message ListCustomerSettlementReportResponse {
  repeated CustomerSettlementReportItem items = 1;
  int32 page = 2;
  int32 page_size = 3;
  int32 total = 4;
}

// Internal reconciliation snapshot. The service authenticates this RPC with
// its dedicated reconciliation token and returns only terminal settlements.
message ListConfirmedSettlementsRequest {
  string provider_id = 1;
  int64 from_unix = 2;
  int64 to_unix = 3;
  string after_settlement_id = 4;
  int32 page_size = 5;
}

message ListConfirmedSettlementsResponse {
  repeated SettlementResponse settlements = 1;
  string next_settlement_id = 2;
}

message SettlementFinalityEvent {
  string event_id = 1;
  string institution_id = 2;
  string settlement_id = 3;
  string trade_id = 4;
  string status = 5;
  string correlation_id = 6;
  int64 occurred_at_unix_nano = 7;
}

message ListPendingSettlementFinalityEventsRequest {
  string consumer_id = 1;
  int32 page_size = 2;
}

message ListPendingSettlementFinalityEventsResponse {
  repeated SettlementFinalityEvent events = 1;
}

message AcknowledgeSettlementFinalityEventRequest {
  string consumer_id = 1;
  string event_id = 2;
}

message AcknowledgeSettlementFinalityEventResponse {
  bool acknowledged = 1;
}

service SettlementService {
  rpc CreateSettlementForTrade(CreateSettlementForTradeRequest) returns (SettlementResponse);
  rpc GetSettlement(GetSettlementRequest) returns (SettlementResponse);
  rpc ListCustomerSettlementReport(ListCustomerSettlementReportRequest) returns (ListCustomerSettlementReportResponse);
  rpc ListConfirmedSettlements(ListConfirmedSettlementsRequest) returns (ListConfirmedSettlementsResponse);
  rpc ListPendingSettlementFinalityEvents(ListPendingSettlementFinalityEventsRequest) returns (ListPendingSettlementFinalityEventsResponse);
  rpc AcknowledgeSettlementFinalityEvent(AcknowledgeSettlementFinalityEventRequest) returns (AcknowledgeSettlementFinalityEventResponse);
}
