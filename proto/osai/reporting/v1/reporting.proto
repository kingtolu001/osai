syntax = "proto3";

package osai.reporting.v1;

option go_package = "github.com/osai/osai/proto/osai/reporting/v1;reportingv1";

message Pagination {
  int32 page = 1;
  int32 page_size = 2;
  string cursor = 3;
}

message Balance {
  string institution_id = 1;
  string currency = 2;
  int64 available_minor = 3;
  int64 held_minor = 4;
  int64 reserved_minor = 5;
  int64 total_minor = 6;
}

message Transaction {
  string transaction_id = 1;
  string institution_id = 2;
  string type = 3;
  int64 amount_minor = 4;
  string currency = 5;
  string status = 6;
  string occurred_at = 7;
  string correlation_id = 8;
  string trade_id = 9;
  string settlement_id = 10;
}

message GetBalancesRequest {
  string institution_id = 1;
}

message GetBalancesResponse {
  repeated Balance balances = 1;
}

message ListTransactionsRequest {
  string institution_id = 1;
  int32 page = 2;
  int32 page_size = 3;
  string cursor = 4;
}

message ListTransactionsResponse {
  repeated Transaction items = 1;
  int32 page = 2;
  int32 page_size = 3;
  int32 total = 4;
  string next_cursor = 5;
  string previous_cursor = 6;
}

service ReportingService {
  rpc GetBalances(GetBalancesRequest) returns (GetBalancesResponse);
  rpc ListTransactions(ListTransactionsRequest) returns (ListTransactionsResponse);
}
