syntax = "proto3";

package osai.trade.v1;

option go_package = "github.com/osai/osai/proto/osai/trade/v1;tradev1";

message Money {
  int64 amount_minor = 1;
  string currency = 2;
}

message PricingSnapshot {
  string quote_mode = 1;
  int64 requested_amount_minor = 2;
  int64 source_principal_minor = 3;
  int64 fee_minor = 4;
  int64 total_debit_minor = 5;
  int64 destination_amount_minor = 6;
  int64 destination_target_minor = 7;
  int64 destination_surplus_minor = 8;
  string source_currency = 9;
  string destination_currency = 10;
  int64 rate_scaled = 11;
  string rate_direction = 12;
  int64 rate_scale = 13;
  string fee_schedule_id = 14;
  int64 fee_schedule_version = 15;
  uint32 source_minor_exponent = 16;
  uint32 destination_minor_exponent = 17;
  int64 fixed_fee_minor = 18;
  int64 fee_basis_points = 19;
  int64 minimum_fee_minor = 20;
  int64 maximum_fee_minor = 21;
  int64 minimum_source_principal_minor = 22;
  int64 maximum_source_principal_minor = 23;
  int64 minimum_total_debit_minor = 24;
  int64 maximum_total_debit_minor = 25;
  int64 minimum_destination_minor = 26;
  int64 maximum_destination_minor = 27;
  string expires_at = 28;
  string snapshot_hash = 29;
}

message CreateTradeFromAcceptedQuoteRequest {
  string institution_id = 1;
  string quote_id = 2;
  string idempotency_key = 3;
  string correlation_id = 4;
  int64 base_amount_minor = 5;
  string base_currency = 6;
  string quote_currency = 7;
  Money amount = 8;
  string beneficiary_id = 9;
  string settlement_provider_id = 10;
  string customer_reference = 11;
  PricingSnapshot pricing_snapshot = 12;
}

message TradeResponse {
  string trade_id = 1;
  string institution_id = 2;
  string quote_id = 3;
  string status = 4;
  int64 base_amount_minor = 5;
  string base_currency = 6;
  string quote_currency = 7;
  string correlation_id = 8;
  string settlement_id = 9;
  string beneficiary_id = 10;
  string settlement_provider_id = 11;
  string customer_reference = 12;
  PricingSnapshot pricing_snapshot = 13;
  string fx_execution_id = 14;
  string fx_executor_id = 15;
  string fx_execution_reference = 16;
  string fx_execution_status = 17;
}

message GetTradeRequest {
  string institution_id = 1;
  string trade_id = 2;
  string correlation_id = 3;
}

message ListTradesRequest {
  string institution_id = 1;
  int32 page = 2;
  int32 page_size = 3;
  string from = 4;
  string to = 5;
  string currency = 6;
  string status = 7;
  string customer_reference = 8;
  string correlation_id = 9;
}

message ListTradesResponse {
  repeated TradeResponse items = 1;
  int32 page = 2;
  int32 page_size = 3;
  int32 total = 4;
}

service TradeService {
  rpc CreateTradeFromAcceptedQuote(CreateTradeFromAcceptedQuoteRequest) returns (TradeResponse);
  rpc GetTrade(GetTradeRequest) returns (TradeResponse);
  rpc ListTrades(ListTradesRequest) returns (ListTradesResponse);
}
