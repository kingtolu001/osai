syntax = "proto3";
package osai.notification.v1;
option go_package = "github.com/osai/osai/proto/osai/notification/v1;notificationv1";
message Event {
 string event_id = 1;
 string institution_id = 2;
 string event_type = 3;
 string correlation_id = 4;
 string aggregate_id = 5;
 string occurred_at = 6;
 string payload_json = 7;
}
message Receipt { string event_id = 1; }
message ConfigureWebhookRequest {
 string institution_id = 1;
 string endpoint_url = 2;
 string signing_secret = 3;
 repeated string subscribed_event_types = 4;
}
message ConfigureWebhookResponse { bool configured = 1; }
message ReplayWebhookRequest {
 string institution_id = 1;
 string event_id = 2;
 string idempotency_key = 3;
}
message ReplayWebhookResponse { bool queued = 1; }
message GetWebhookDeliveryHistoryRequest {
 string institution_id = 1;
 string event_id = 2;
 int32 limit = 3;
 int32 offset = 4;
}
message WebhookDeliveryAttempt {
 int32 attempt_number = 1;
 string attempted_at = 2;
 int32 http_status = 3;
 string outcome = 4;
 string completed_at = 5;
}
message GetWebhookDeliveryHistoryResponse {
 string event_id = 1;
 string event_type = 2;
 string status = 3;
 int32 attempt_count = 4;
 int32 replay_count = 5;
 string next_attempt_at = 6;
 repeated WebhookDeliveryAttempt attempts = 7;
}
message ListWebhookDeliveryEventsRequest {
 string institution_id = 1;
 string status = 2;
 int32 limit = 3;
 int32 offset = 4;
}
message WebhookDeliveryEventSummary {
 string event_id = 1;
 string event_type = 2;
 string status = 3;
 int32 attempt_count = 4;
 int32 replay_count = 5;
 string next_attempt_at = 6;
 string occurred_at = 7;
}
message ListWebhookDeliveryEventsResponse {
 repeated WebhookDeliveryEventSummary events = 1;
 int32 total = 2;
}
service NotificationService {
 rpc PublishEvent(Event) returns (Receipt);
 rpc ConfigureWebhook(ConfigureWebhookRequest) returns (ConfigureWebhookResponse);
 rpc ReplayWebhook(ReplayWebhookRequest) returns (ReplayWebhookResponse);
 rpc GetWebhookDeliveryHistory(GetWebhookDeliveryHistoryRequest) returns (GetWebhookDeliveryHistoryResponse);
 rpc ListWebhookDeliveryEvents(ListWebhookDeliveryEventsRequest) returns (ListWebhookDeliveryEventsResponse);
}
