syntax = "proto3";
package osai.notification.v1;
option go_package = "github.com/osai/osai/proto/osai/notification/v1;notificationv1";
message Event {
 string event_id = 1;
 string institution_id = 2;
 string event_type = 3;
 string correlation_id = 4;
 string aggregate_id = 5;
 string occurred_at = 6;
 string payload_json = 7;
}
message Receipt { string event_id = 1; }
message ConfigureWebhookRequest {
 string institution_id = 1;
 string endpoint_url = 2;
 string signing_secret = 3;
 repeated string subscribed_event_types = 4;
}
message ConfigureWebhookResponse { bool configured = 1; }
message ReplayWebhookRequest {
 string institution_id = 1;
 string event_id = 2;
 string idempotency_key = 3;
}
message ReplayWebhookResponse { bool queued = 1; }
service NotificationService {
 rpc PublishEvent(Event) returns (Receipt);
 rpc ConfigureWebhook(ConfigureWebhookRequest) returns (ConfigureWebhookResponse);
 rpc ReplayWebhook(ReplayWebhookRequest) returns (ReplayWebhookResponse);
}
